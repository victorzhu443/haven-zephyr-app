# ── Bluetooth LE peripheral ──────────────────────────────────────────────────
# On nRF5340 the Host runs here on the app core; the Controller runs on the
# network core via the hci_rpmsg image — see sysbuild.conf.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Haven"
CONFIG_BT_DEVICE_APPEARANCE=962
CONFIG_BT_MAX_CONN=1

# Nordic UART Service (NUS) from nRF Connect SDK
CONFIG_BT_NUS=y

# The app negotiates MTU 247 so a 5-band MULTI_FILTER JSON fits in one write.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# ── Buses to the ADAU1860 ───────────────────────────────────────────────────
# I2C (bus per board file) is the control port: registers, FastDSP program
# and parameter safeloads. I2S0 (nRF master, 48 kHz, 16-bit stereo) carries
# only the LDL calibration tone from tone_gen.c into the codec's serial port
# 0; hear-through audio never leaves the codec.
CONFIG_I2C=y
CONFIG_I2S=y
# tone_gen.c keeps two blocks ahead of the DMA; the driver's TX queue depth
# (default 4) is fine -- listed here so the relationship is visible.
CONFIG_I2S_NRFX_TX_BLOCK_COUNT=4

# ── Settings persistence (NVS) for Volume/FreqRange ─────────────────────────
# `storage_partition` already exists in the nRF5340 DK's default flash
# partition table (nrf5340_cpuapp_partition.dtsi) -- no overlay needed.
# CONFIG_SETTINGS=y + CONFIG_NVS=y is enough for the backend choice to
# default to SETTINGS_NVS.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# ── Runtime ─────────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

# ── Power management ─────────────────────────────────────────────────────────
# Baseline CPU idle power savings (WFE/WFI between work) -- this app has no
# device driver PM state machines to opt into yet (I2C/I2S/GPIO aren't runtime
# suspended), so CONFIG_PM_DEVICE is deliberately not enabled here. See
# ble_transport.c for the advertising-side power saving (fast->slow interval)
# and wake_button.c for the button0 wake trigger.
CONFIG_PM=y
CONFIG_GPIO=y

# strtof/printf of floats for JSON band parsing and logging
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ── Logging ─────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y

# Default 1024B up-buffer fills before boot even finishes (BT HCI core
# alone logs ~700B) and CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP means anything
# past a full buffer is silently dropped rather than blocking or
# overwriting — a snapshot dump taken any time after boot without a
# continuously-draining RTT client attached from t=0 will look like the
# firmware hung right after the last line that fit. Confirmed via
# arch_cpu_idle at the PC, not a crash. Bumped so a whole boot burst fits.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384
