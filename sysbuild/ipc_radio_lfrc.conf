# LFRC fallback -- network core (ipc_radio = the BLE controller).
#
# Applied to the ipc_radio image by sysbuild when building with
# `-DFILE_SUFFIX=lfrc` (sysbuild looks for sysbuild/<image>_<suffix>.conf;
# verified in sdk-zephyr ncs-v3.4-branch
# share/sysbuild/cmake/modules/sysbuild_extensions.cmake, the
# `sysbuild_image_conf_fragment` block). Must match the application core's
# boards/*_lfrc.conf: on the nRF5340 the LF clock source is a shared choice
# and the controller's timing assumes whatever source it was told about.
#
# No calibration here: CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION defaults off
# for the net core (Kconfig.nrf: `default y if !SOC_NRF53_CPUNET_ENABLE`);
# the application core owns calibration.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
