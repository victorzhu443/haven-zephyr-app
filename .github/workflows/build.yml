# Builds the app-core image (plus the net-core ipc_radio image via sysbuild)
# for every board target this firmware supports, on every push to master
# (this repo's default branch) and on PRs targeting it — so a break surfaces
# before merge, not after. `workflow_dispatch` lets a feature branch be
# built on demand (this is the only compiler most contributors have for
# Zephyr: the toolchain isn't assumed locally).
#
# NOTE: For C/Zephyr there's no separate "typecheck" phase distinct from
# compilation the way there is for TS — `west build` performing a full GCC
# compile of every translation unit *is* the type check. A green run means
# both "compiles" and "types are consistent" in one step.
#
# NOTE: originally used nordicplayground/nrfconnect-sdk:main, which is why
# CI was failing (build 32862318520/32864473134, "manifest unknown") --
# that image/repo was archived by Nordic in Dec 2024, its own README now
# points here instead: https://github.com/NordicPlayground/nrf-docker
# ghcr.io/zephyrproject-rtos/ci:v0.29.3 bundles Zephyr SDK 1.0.1, which
# matches the SDK version verified locally against this repo's pinned NCS
# v3.4.0 (west.yml) / Zephyr 4.4.0 -- see zephyrproject-rtos/docker-image's
# own release notes before bumping this tag, to keep that match.
name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bench: nRF5340 DK + an ADAU1860 eval board on the Arduino header.
          - board: nrf5340dk/nrf5340/cpuapp
            name: nrf5340dk
          # Product: OpenEarable 2.0 / Haven board (boards/teco/openearable_v2).
          - board: openearable_v2/nrf5340/cpuapp
            name: openearable_v2
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.29.3
    env:
      # The image bundles the Zephyr SDK (confirmed: Zephyr-sdk 1.0 is
      # what CMake went looking for, build 32873026416) but doesn't
      # export its location for CMake's find_package(Zephyr-sdk) to see
      # on its own -- has to be told explicitly. /opt/toolchains is the
      # documented install path for this image family (see
      # interrupt.memfault.com/blog/ncs-github-actions for a working
      # example against the same zephyrproject-rtos/ci image line).
      CMAKE_PREFIX_PATH: /opt/toolchains

    steps:
      - name: Checkout haven_zephyr_app
        uses: actions/checkout@v4
        with:
          path: haven_zephyr_app
          # Least-privilege only -- not the fix for the west failures this
          # repo's git history chased through several commits. The real
          # cause was a wrong repo path in west.yml (see its own NOTE); a
          # diagnostic step proved anonymous git access itself was fine
          # the whole time.
          persist-credentials: false

      - name: Host unit tests (plain gcc, no Zephyr)
        run: |
          cd haven_zephyr_app/tests/host && ./run_tests.sh

      - name: Initialize west workspace
        run: |
          west init -l haven_zephyr_app
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Build ${{ matrix.name }} (application core + net-core ipc_radio via sysbuild)
        run: |
          # --pristine bare (no value) is only valid on west versions where
          # it's an optional-argument flag; this container's west requires
          # an explicit choice, and without one silently swallowed the
          # source_dir positional as its value instead (build 32872241192,
          # "invalid choice: 'haven_zephyr_app'"). Spelling out `always`
          # works on both.
          west build \
            --board ${{ matrix.board }} \
            --sysbuild \
            --pristine always \
            haven_zephyr_app

      # No merged.hex: that's an MCUboot-merged-image convention and this
      # build has no bootloader (see sysbuild.conf) -- sysbuild instead
      # produces two independent per-core images, flashed separately
      # (`west flash --runner jlink`, verified locally).
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haven-firmware-${{ matrix.name }}
          path: |
            build/haven_zephyr_app/zephyr/zephyr.hex
            build/haven_zephyr_app/zephyr/zephyr.elf
            build/ipc_radio/zephyr/zephyr.hex
          if-no-files-found: warn
