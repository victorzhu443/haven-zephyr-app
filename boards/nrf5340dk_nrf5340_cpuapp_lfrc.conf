# LFRC fallback -- application core.
#
# Run the nRF5340's 32.768 kHz low-frequency clock from the internal RC
# oscillator (calibrated against the HFXO) instead of the external X1
# crystal. Use this ONLY if BLE never comes up on a board whose 32 kHz
# crystal may not be oscillating -- the 5x bench board's X1 sat 30 mm from
# the module before haven-dev-board-kicad PR #5 (issue #4). Symptoms: no
# advertising seen by the phone, or bt_enable() never returning / timing
# out waiting for the LF clock.
#
# Cost: RC accuracy is 250 ppm class (CLOCK_CONTROL_NRF_K32SRC_250PPM is the
# default the clock driver picks for RC on nRF53), which is within BLE's
# 500 ppm sleep-clock budget but worsens power (more frequent calibration,
# wider receive windows). Not for the product; for getting a bench alive.
#
# The network core (ipc_radio, the BLE controller) MUST get the same choice
# -- see sysbuild/ipc_radio_lfrc.conf; both are applied together by
# `-DFILE_SUFFIX=lfrc` (README "LFRC fallback").
#
# Symbol names verified against sdk-zephyr ncs-v3.4-branch
# drivers/clock_control/Kconfig.nrf (choice CLOCK_CONTROL_NRF_SOURCE;
# CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION depends on the hfxo node, present
# on cpuapp).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
